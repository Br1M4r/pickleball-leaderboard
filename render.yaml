# Render Blueprint (optional). In Render: New > Blueprint > select this repo.
# Set rootDir to "backend" if this file lives in the backend folder of a monorepo.
services:
  - type: web
    name: pickleball-leaderboard-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: Jwt__Secret
        generateValue: true
      - key: Cors__AllowedOrigins
        sync: false
      - key: Admin__Email
        sync: false
      - key: Admin__Password
        sync: false
